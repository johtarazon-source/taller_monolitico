<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1114" />
    <title>Iniciar sesión | Gestor de Alquiler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/index.css?v=3" />
  </head>
  <body class="aplicacion--inicio-sesion" data-pagina="login">
    <main class="aplicacion__contenido" id="contenido-principal" tabindex="-1">
      <section class="inicio-sesion">
        <form class="inicio-sesion__tarjeta" id="formulario-inicio-sesion" novalidate>
          <span class="logo">
            <svg class="logo__marca" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true" focusable="false">
              <path d="M31 10.5A14 14 0 1 0 31 29.5" stroke-width="4.5" />
              <path d="M25.5 16a6.5 6.5 0 1 0 0 8" stroke-width="3.5" />
            </svg>
            <span class="logo__texto">CarRent</span>
          </span>
          <div>
            <h1 class="inicio-sesion__titulo">Iniciar sesión</h1>
            <p class="texto-suave">Ingrese para gestionar la flota, los clientes y las reservas.</p>
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="usuario">Usuario</label>
            <input class="campo__control" id="usuario" name="usuario" type="text" required autocomplete="username" />
          </div>

          <div class="campo">
            <label class="campo__etiqueta" for="contrasena">Contraseña</label>
            <input class="campo__control" id="contrasena" name="password" type="password" required autocomplete="current-password" />
          </div>

          <p class="mensaje-error" id="inicio-sesion-error" role="alert" hidden></p>

          <button type="submit" class="boton boton--destacado boton--grande boton--bloque">Entrar</button>
        </form>
      </section>
    </main>

    <script type="module" src="js/app.js?v=3"></script>
  </body>
</html>
